
{% extends "base.html" %}

{% block title %}
Supprimer un département
{% endblock %}

{% block content %}

<style>

.delete-card{
    max-width:650px;
    margin:60px auto;
    background:#fff;
    padding:35px;
    border-radius:18px;
    box-shadow:0 10px 30px rgba(0,0,0,.08);
    text-align:center;
}

.delete-icon{
    width:80px;
    height:80px;
    margin:auto;
    border-radius:50%;
    background:#fdecec;
    color:#dc2626;
    display:flex;
    justify-content:center;
    align-items:center;
    font-size:32px;
    margin-bottom:20px;
}

.delete-card h2{
    margin-bottom:15px;
}

.delete-card p{
    color:#6b7280;
    line-height:1.7;
}

.actions{
    margin-top:30px;
    display:flex;
    justify-content:center;
    gap:15px;
}

.btn{
    padding:12px 22px;
    border:none;
    border-radius:10px;
    cursor:pointer;
    text-decoration:none;
    color:#fff;
    font-weight:600;
}

.cancel{
    background:#6b7280;
}

.delete{
    background:#dc2626;
}

</style>

<div class="delete-card">

    <div class="delete-icon">
        <i class="fa-solid fa-trash"></i>
    </div>

    <h2>Supprimer le département</h2>

    <p>
        Voulez-vous vraiment supprimer le département
        <strong>{{ department.name }}</strong> ?
    </p>

    <p style="color:#dc2626;font-weight:600;">
        Cette action est irréversible.
    </p>

    <form method="POST">

        {% csrf_token %}

        <div class="actions">

            <a href="{% url 'department_list' %}" class="btn cancel">
                Annuler
            </a>

            <button type="submit" class="btn delete">
                Supprimer
            </button>

        </div>

    </form>

</div>

{% endblock %}
