{% extends "base.html" %}

{% block title %}
Modifier un employé
{% endblock %}

{% block content %}
<style>

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap');

    :root{
        --bg:#f3f5fa;
        --surface:#ffffff;
        --ink:#0d1321;
        --ink-soft:#6b7280;
        --line:#e9ecf3;
        --indigo:#1060A4;
        --indigo-deep:#0a3f6e;
        --indigo-soft:#edf5fc;
        --red:#dc2626;
        --red-soft:#fdecec;
        --gold:#c9a24b;
        --shadow-sm:0 1px 2px rgba(13,19,33,.04), 0 1px 1px rgba(13,19,33,.03);
        --shadow-lg:0 20px 44px rgba(10,63,110,.20);
    }

    * { font-family:'Manrope', sans-serif; }

    /* ---- header ---- */

    .employee-header{
        display:flex;
        justify-content:space-between;
        align-items:center;
        flex-wrap:wrap;
        gap:20px;
        margin-bottom:32px;
        padding:30px 34px;
        background:linear-gradient(120deg, var(--indigo) 0%, var(--indigo-deep) 100%);
        border-radius:22px;
        box-shadow:var(--shadow-lg);
        position:relative;
        overflow:hidden;
    }

    .employee-header::before{
        content:'';
        position:absolute;
        top:-60%;
        right:-8%;
        width:300px;
        height:300px;
        background:radial-gradient(circle, rgba(255,255,255,.13) 0%, transparent 70%);
        border-radius:50%;
    }

    .employee-header::after{
        content:'';
        position:absolute;
        bottom:0;
        left:0;
        width:100%;
        height:3px;
        background:linear-gradient(90deg, var(--gold) 0%, transparent 60%);
        opacity:.8;
    }

    .employee-header > div{
        position:relative;
        z-index:1;
    }

    .employee-header h1{
        font-family:'Fraunces', serif;
        font-weight:600;
        font-size:27px;
        letter-spacing:-.01em;
        color:#fff;
        display:flex;
        align-items:center;
        gap:14px;
        margin:0 0 8px 0;
    }

    .employee-header h1 i{
        width:40px;
        height:40px;
        display:inline-flex;
        align-items:center;
        justify-content:center;
        background:rgba(255,255,255,.14);
        backdrop-filter:blur(6px);
        color:var(--gold);
        border-radius:12px;
        font-size:15px;
        border:1px solid rgba(255,255,255,.18);
    }

    .employee-header p{
        color:rgba(255,255,255,.78);
        font-size:14.5px;
        font-weight:500;
        margin:0;
        padding-left:54px;
    }

    .back-btn{
        position:relative;
        z-index:1;
        background:rgba(255,255,255,.14);
        color:#fff;
        padding:13px 20px;
        border-radius:12px;
        text-decoration:none;
        font-weight:700;
        font-size:14.5px;
        display:inline-flex;
        align-items:center;
        gap:8px;
        border:1px solid rgba(255,255,255,.28);
        transition:.25s ease;
    }

    .back-btn:hover{
        background:rgba(255,255,255,.24);
        transform:translateY(-2px);
    }

    /* ---- form card ---- */

    .form-card{
        background:var(--surface);
        border-radius:20px;
        padding:34px 38px;
        border:1px solid var(--line);
        box-shadow:var(--shadow-sm);
        max-width:680px;
        margin:0 auto;
    }

    .form-card form > p{
        margin-bottom:20px;
    }

    .form-card form > p:last-of-type{
        margin-bottom:0;
    }

    .form-card form label{
        display:block;
        margin-bottom:8px;
        font-weight:700;
        font-size:12.5px;
        text-transform:uppercase;
        letter-spacing:.05em;
        color:var(--ink-soft);
    }

    .form-card form input,
    .form-card form select,
    .form-card form textarea{
        width:100%;
        padding:12px 15px;
        border:1px solid var(--line);
        border-radius:11px;
        font-size:14.5px;
        font-weight:500;
        font-family:'Manrope', sans-serif;
        color:var(--ink);
        background:var(--bg);
        transition:.2s ease;
        box-sizing:border-box;
    }

    .form-card form textarea{
        min-height:90px;
        resize:vertical;
    }

    .form-card form input[type="file"]{
        padding:10px 15px;
        cursor:pointer;
    }

    .form-card form input:focus,
    .form-card form select:focus,
    .form-card form textarea:focus{
        outline:none;
        border-color:var(--indigo);
        background:#fff;
        box-shadow:0 0 0 3px var(--indigo-soft);
    }

    .form-card form ul.errorlist{
        list-style:none;
        margin:6px 0 0 0;
        padding:0;
        color:var(--red);
        font-size:12.5px;
        font-weight:600;
    }

    /* ---- actions ---- */

    .form-actions{
        display:flex;
        justify-content:center;
        gap:14px;
        margin-top:28px;
        padding-top:24px;
        border-top:1px solid var(--line);
        flex-wrap:wrap;
    }

    .cancel-btn,
    .save-btn{
        display:inline-flex;
        align-items:center;
        gap:9px;
        padding:14px 26px;
        border-radius:12px;
        border:none;
        text-decoration:none;
        font-weight:700;
        font-size:14.5px;
        cursor:pointer;
        transition:.25s ease;
        font-family:'Manrope', sans-serif;
    }

    .cancel-btn{
        background:var(--surface);
        color:var(--ink-soft);
        border:1px solid var(--line);
    }

    .cancel-btn:hover{
        background:var(--bg);
        color:var(--ink);
    }

    .save-btn{
        background:linear-gradient(120deg, var(--indigo) 0%, var(--indigo-deep) 100%);
        color:#fff;
        box-shadow:0 8px 20px rgba(16,96,164,.25);
    }

    .save-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 12px 26px rgba(16,96,164,.32);
    }
</style>

<div class="employee-header">

    <div>

        <h1>
            <i class="fa-solid fa-user-pen"></i>
            Modifier un employé
        </h1>

        <p>
            Mettez à jour les informations de l'employé.
        </p>

    </div>

    <a href="{% url 'employee_list' %}" class="back-btn">

        <i class="fa-solid fa-arrow-left"></i>

        Retour à la liste

    </a>

</div>

<div class="form-card">

    <form method="POST"
          enctype="multipart/form-data">

        {% csrf_token %}

        {{ form.as_p }}

        <div class="form-actions">

            <a href="{% url 'employee_list' %}" class="cancel-btn">

                Annuler

            </a>

            <button type="submit" class="save-btn">

                <i class="fa-solid fa-floppy-disk"></i>

                Enregistrer les modifications

            </button>

        </div>

    </form>

</div>

{% endblock %}
