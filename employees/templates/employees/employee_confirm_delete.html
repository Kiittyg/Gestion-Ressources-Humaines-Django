{% extends "base.html" %}

{% block title %}
Supprimer un employé
{% endblock %}

{% block content %}
<style>

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap');

    :root{
        --bg:#f3f5fa;
        --surface:#ffffff;
        --ink:#0d1321;
        --ink-soft:#6b7280;
        --line:#e9ecf3;
        --indigo:#1060A4;
        --indigo-deep:#0a3f6e;
        --indigo-soft:#edf5fc;
        --red:#dc2626;
        --red-soft:#fdecec;
        --shadow-lg:0 20px 44px rgba(10,63,110,.14);
    }

    * { font-family:'Manrope', sans-serif; }

    .delete-card{
        max-width:560px;
        margin:60px auto;
        background:var(--surface);
        border-radius:22px;
        padding:48px 44px;
        box-shadow:var(--shadow-lg);
        border:1px solid var(--line);
        text-align:center;
        position:relative;
        overflow:hidden;
    }

    .delete-card::before{
        content:'';
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:4px;
        background:var(--red);
    }

    .delete-icon{
        width:78px;
        height:78px;
        margin:0 auto 24px auto;
        border-radius:50%;
        background:var(--red-soft);
        color:var(--red);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:32px;
        box-shadow:0 0 0 8px rgba(220,38,38,.06);
    }

    .delete-card h2{
        font-family:'Fraunces', serif;
        font-weight:600;
        font-size:21px;
        letter-spacing:-.01em;
        color:var(--ink);
        margin-bottom:14px;
    }

    .delete-card p{
        color:var(--ink-soft);
        font-size:14.5px;
        line-height:1.7;
        font-weight:500;
        margin-bottom:10px;
    }

    .employee-name{
        color:var(--indigo);
        font-weight:700;
    }

    .warning{
        display:inline-flex;
        align-items:center;
        gap:8px;
        background:var(--red-soft);
        color:var(--red);
        font-weight:700;
        font-size:13px;
        padding:10px 18px;
        border-radius:30px;
        margin-top:14px;
    }

    .actions{
        margin-top:32px;
        padding-top:26px;
        border-top:1px solid var(--line);
        display:flex;
        justify-content:center;
        gap:14px;
        flex-wrap:wrap;
    }

    .btn{
        display:inline-flex;
        align-items:center;
        gap:9px;
        padding:13px 24px;
        border-radius:12px;
        text-decoration:none;
        font-weight:700;
        font-size:14.5px;
        border:none;
        cursor:pointer;
        transition:.25s ease;
        font-family:'Manrope', sans-serif;
    }

    .btn:hover{
        transform:translateY(-2px);
    }

    .cancel{
        background:var(--surface);
        color:var(--ink-soft);
        border:1px solid var(--line);
    }

    .cancel:hover{
        background:var(--bg);
        color:var(--ink);
    }

    .delete{
        background:var(--red);
        color:#fff;
        box-shadow:0 8px 20px rgba(220,38,38,.25);
    }

    .delete:hover{
        background:#b91c1c;
        box-shadow:0 12px 26px rgba(220,38,38,.32);
    }

</style>

<div class="delete-card">

    <div class="delete-icon">
        <i class="fa-solid fa-user-xmark"></i>
    </div>

    <h2>Supprimer un employé</h2>

    <p>
        Es-tu sûr de vouloir supprimer
        <span class="employee-name">
            {{ employee.nom }} {{ employee.prenom }}
        </span>
        de la liste des employés ?
    </p>

    <span class="warning">
        <i class="fa-solid fa-triangle-exclamation"></i>
        Cette action est irréversible
    </span>

    <form method="POST">

        {% csrf_token %}

        <div class="actions">

            <a href="{% url 'employee_list' %}" class="btn cancel">
                <i class="fa-solid fa-xmark"></i>
                Annuler
            </a>

            <button type="submit" class="btn delete">
                <i class="fa-solid fa-trash"></i>
                Oui, supprimer
            </button>

        </div>

    </form>

</div>

{% endblock %}
