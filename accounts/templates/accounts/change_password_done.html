{% extends "base.html" %}

{% block title %}
Mot de passe modifié
{% endblock %}

{% block content %}
<style>

    @import url('https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Fraunces:opsz,wght@9..144,600&display=swap');

    :root{
        --bg:#f3f5fa;
        --surface:#ffffff;
        --ink:#0d1321;
        --ink-soft:#6b7280;
        --line:#e9ecf3;
        --indigo:#1060A4;
        --indigo-deep:#0a3f6e;
        --indigo-soft:#edf5fc;
        --teal:#0d9488;
        --teal-soft:#e6f7f5;
        --gold:#c9a24b;
        --shadow-sm:0 1px 2px rgba(13,19,33,.04), 0 1px 1px rgba(13,19,33,.03);
        --shadow-lg:0 20px 44px rgba(10,63,110,.16);
    }

    * { font-family:'Manrope', sans-serif; }

    /* ---- success card ---- */

    .success-card{
        max-width:480px;
        margin:60px auto;
        background:var(--surface);
        border-radius:22px;
        padding:52px 44px;
        border:1px solid var(--line);
        box-shadow:var(--shadow-lg);
        text-align:center;
        position:relative;
        overflow:hidden;
    }

    .success-card::before{
        content:'';
        position:absolute;
        top:0;
        left:0;
        width:100%;
        height:4px;
        background:linear-gradient(90deg, var(--teal) 0%, var(--gold) 100%);
    }

    .success-icon{
        width:78px;
        height:78px;
        margin:0 auto 26px auto;
        border-radius:50%;
        background:var(--teal-soft);
        color:var(--teal);
        display:flex;
        align-items:center;
        justify-content:center;
        font-size:34px;
        box-shadow:0 0 0 8px rgba(13,148,136,.08);
    }

    .success-card h2{
        font-family:'Fraunces', serif;
        font-weight:600;
        font-size:22px;
        color:var(--ink);
        letter-spacing:-.01em;
        margin:0 0 14px 0;
    }

    .success-card p{
        font-size:14.5px;
        line-height:1.6;
        color:var(--ink-soft);
        font-weight:500;
        margin:0 0 30px 0;
    }

    .back-btn{
        display:inline-flex;
        align-items:center;
        gap:9px;
        padding:14px 28px;
        border-radius:12px;
        text-decoration:none;
        font-weight:700;
        font-size:14.5px;
        color:#fff;
        background:linear-gradient(120deg, var(--indigo) 0%, var(--indigo-deep) 100%);
        box-shadow:0 8px 20px rgba(16,96,164,.25);
        transition:.25s ease;
    }

    .back-btn:hover{
        transform:translateY(-2px);
        box-shadow:0 12px 26px rgba(16,96,164,.32);
    }
</style>

<div class="success-card">

    <div class="success-icon">

        <i class="fa-solid fa-circle-check"></i>

    </div>

    <h2>

        Mot de passe modifié avec succès

    </h2>

    <p>

        Votre mot de passe a été mis à jour.
        Lors de votre prochaine connexion, utilisez votre nouveau mot de passe.

    </p>

    <a href="{% url 'employee_dashboard' %}" class="back-btn">

        <i class="fa-solid fa-house"></i>

        Retour au tableau de bord

    </a>

</div>

{% endblock %}
